name: Android APK (Android 10–15)
permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'package.json'
      - 'capacitor.config.ts'
      - 'manifest.webmanifest'
      - 'sw.js'
      - '.github/workflows/android.yml'
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm install
      - name: Build web app
        run: npm run build
      - name: Generate Android project
        run: npx cap add android
      - name: Set Android 10 minimum
        run: |
          if [ -f android/variables.gradle ]; then
            sed -i 's/minSdkVersion = 23/minSdkVersion = 29/' android/variables.gradle
          fi
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: thought-and-feelings-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish stable Android APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Thought & Feelings Android — Latest
          body: Automated latest Android APK build for Thought & Feelings. This rolling release is updated by the Android build workflow.
          prerelease: true
          make_latest: false
          files: android/app/build/outputs/apk/debug/app-debug.apk
          overwrite_files: true
